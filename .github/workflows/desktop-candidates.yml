name: Reviewed Ubuntu desktop candidate
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing main-branch vVERSION tag for a data-approved candidate
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: desktop-linux-candidate
  cancel-in-progress: false
jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source_commit: ${{ steps.authorize.outputs.source_commit }}
      version: ${{ steps.authorize.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          ATOM_CANDIDATE_TAG: ${{ inputs.tag }}
        run: node desktop/scripts/authorize-candidate.mjs
  ubuntu:
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: desktop-candidates
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: policy
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          ref: ${{ needs.authorize.outputs.source_commit }}
          persist-credentials: false
          lfs: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: source/backend-go/go.mod
          cache-dependency-path: source/backend-go/go.sum
      - name: Prepare Ubuntu graphical sessions and package inspection
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev binutils desktop-file-utils appstream file lsof mutter xvfb dbus-x11 apparmor-utils fuse3 xdg-utils xdg-desktop-portal xdg-desktop-portal-gtk xdg-desktop-portal-gnome libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libxss1 libxshmfence1 libxkbcommon0 libatk-bridge2.0-0t64 libcups2t64
      - run: npm ci --prefix source/frontend-react
      - run: npm ci --prefix source/desktop
      - run: npm run build --prefix source/desktop
      - run: npm run package --prefix source/desktop
      - run: npm run package:deb --prefix source/desktop -- --candidate
      - name: Qualify the exact installed candidate under X11
        run: |
          xvfb-run -a -s '-screen 0 1440x900x24 -nolisten tcp' dbus-run-session -- sh source/desktop/test/deb-session.sh x11
          cp source/desktop/test-results/deb-installed.json source/desktop/test-results/candidate-x11.json
      - name: Qualify the same installed candidate under Wayland
        run: |
          dbus-run-session -- sh source/desktop/test/deb-session.sh wayland
          cp source/desktop/test-results/deb-installed.json source/desktop/test-results/candidate-wayland.json
      - name: Bind approved data, runtime notices, SBOM and native receipts to the candidate
        env:
          CANDIDATE_VERSION: ${{ needs.authorize.outputs.version }}
        run: >-
          node policy/desktop/scripts/candidate-metadata.mjs
          "source/desktop/build/packages/atom-${CANDIDATE_VERSION}-linux-x64-internal-unsigned"
          policy/desktop/build/linux-candidate
          source/desktop/test-results/candidate-x11.json
          source/desktop/test-results/candidate-wayland.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualified-candidate-${{ needs.authorize.outputs.version }}-linux-x64
          path: policy/desktop/build/linux-candidate/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: linux-candidate-diagnostics
          path: |
            source/desktop/test-results/deb-installed.json
            source/desktop/test-results/packaged.json
            source/desktop/test-results/package-failed.png
            source/desktop/test-results/deb-compositor.log
          if-no-files-found: warn
          retention-days: 14
