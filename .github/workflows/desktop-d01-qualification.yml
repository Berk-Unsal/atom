name: Desktop D01 Electron qualification

# Branch-only evidence run for #148. It does not gate main, publish anything,
# or use secrets.
on:
  push:
    branches: [spike/desktop-d01-qualification]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-d01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: Ubuntu 24.04 x86_64 (${{ matrix.session }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        session: [x11, wayland]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: backend-go/go.mod
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Build the committed frontend
        working-directory: frontend-react
        run: npm ci --no-fund --no-audit && npm run build
      - name: Install the pinned Electron spike
        working-directory: desktop/spike/electron
        run: |
          npm ci --no-fund --no-audit
          node node_modules/electron/install.js
          npx playwright-core install --with-deps chromium
      - name: Record platform and libraries Electron lacks before runtime packages
        run: scripts/desktop-spike/linux-environment.sh before
      - name: Install GNOME Mutter session and Electron runtime packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mutter dbus-x11 xvfb xdotool lsof \
            libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libxss1 libxshmfence1 libxkbcommon0 libatk-bridge2.0-0t64 libcups2t64
      - name: Record platform after runtime packages
        run: scripts/desktop-spike/linux-environment.sh after
      - name: Qualify Electron (${{ matrix.session }})
        run: scripts/desktop-spike/linux-session.sh ${{ matrix.session }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: d01-ubuntu-24.04-${{ matrix.session }}
          path: desktop/spike/electron/build/evidence
          retention-days: 30

  macos-intel:
    name: macOS 15 x86_64 (Intel)
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: backend-go/go.mod
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Build the committed frontend
        working-directory: frontend-react
        run: npm ci --no-fund --no-audit && npm run build
      - name: Install the pinned Electron spike
        working-directory: desktop/spike/electron
        run: |
          npm ci --no-fund --no-audit
          node node_modules/electron/install.js
          npx playwright-core install chromium
      - name: Record platform
        run: |
          mkdir -p desktop/spike/electron/build/evidence
          { sw_vers; uname -m; sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize; } | tee desktop/spike/electron/build/evidence/macos-environment.txt
      - name: Qualify Electron
        env:
          ATOM_SPIKE_DIALOG_DRIVER: macos
        run: scripts/desktop-spike/qualify-electron.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: d01-macos-15-intel
          path: desktop/spike/electron/build/evidence
          retention-days: 30
