name: Ubuntu desktop package

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'backend-go/**'
      - 'frontend-react/**'
      - 'icon/**'
      - 'VERSION'
      - '.github/workflows/desktop-deb.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-deb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: Ubuntu 24.04 deb (${{ matrix.session }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        session: [x11, wayland]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Prepare updated Ubuntu reference session and dependency inspection
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev binutils desktop-file-utils appstream file lsof mutter xvfb dbus-x11 apparmor-utils xdg-utils xdg-desktop-portal xdg-desktop-portal-gtk xdg-desktop-portal-gnome libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libxss1 libxshmfence1 libxkbcommon0 libatk-bridge2.0-0t64 libcups2t64
      - run: npm ci --prefix frontend-react
      - run: npm ci --prefix desktop
      - run: npm run build --prefix desktop
      - run: npm run package --prefix desktop
      - run: npm run package:deb --prefix desktop
      - name: Exercise installed package, upgrade and removal in X11
        if: matrix.session == 'x11'
        run: xvfb-run -a -s '-screen 0 1440x900x24 -nolisten tcp' dbus-run-session -- sh desktop/test/deb-session.sh x11
      - name: Exercise installed package, upgrade and removal in Wayland
        if: matrix.session == 'wayland'
        run: dbus-run-session -- sh desktop/test/deb-session.sh wayland
      # The exact bundled default pack remains unapproved for redistribution.
      # Keep only evidence; do not upload .deb, tar.gz or copied data layers.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ubuntu-deb-evidence-${{ matrix.session }}
          path: |
            desktop/build/packages/*/package.json
            desktop/build/packages/*/deb.json
            desktop/build/packages/*/files.json
            desktop/build/packages/*/SHA256SUMS
            desktop/build/packages/*/*.sbom.cdx.json
            desktop/build/packages/*/*.license-index.json
            desktop/test-results/deb-installed.json
            desktop/test-results/packaged.json
            desktop/test-results/package-failed.png
            desktop/test-results/deb-compositor.log
          if-no-files-found: warn
          retention-days: 30
