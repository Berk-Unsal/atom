name: Production native dialogs
on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'frontend-react/**'
      - 'backend-go/**'
      - 'VERSION'
      - '.github/workflows/desktop-native-surfaces.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-native-dialogs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dialogs:
    name: Production GTK dialogs (${{ matrix.session }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        session: [x11, wayland]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Prepare Ubuntu, native sessions, actual GTK portal and accessibility
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev binutils desktop-file-utils appstream file lsof mutter xvfb dbus-x11 apparmor-utils fuse3 xdg-utils xdg-user-dirs xdg-desktop-portal xdg-desktop-portal-gtk xdg-desktop-portal-gnome python3-pyatspi libatk-adaptor at-spi2-core libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libxss1 libxshmfence1 libxkbcommon0 libatk-bridge2.0-0t64 libcups2t64
          sudo apt-get install -y --no-install-recommends cups cups-client printer-driver-cups-pdf poppler-utils
          sudo apt-get install -y --no-install-recommends pipewire wireplumber python3-gst-1.0 gstreamer1.0-pipewire gstreamer1.0-plugins-base gstreamer1.0-plugins-good
          sudo apt-get install -y --no-install-recommends python3-pil tesseract-ocr xdotool
      - name: Configure only a local virtual printer on the disposable VM
        run: |
          sudo systemctl start cups
          sudo lpadmin -p AtomQualification -E -v cups-pdf:/ -P /usr/share/ppd/cups-pdf/CUPS-PDF_opt.ppd -o printer-is-shared=false -D AtomQualification
          sudo lpadmin -d AtomQualification
          lpstat -v AtomQualification
          lpstat -d
      - run: npm ci --prefix frontend-react
      - run: npm ci --prefix desktop
      - run: npm run build --prefix desktop
      - run: npm run package --prefix desktop
      - run: npm run package:deb --prefix desktop
      - name: Install the internal candidate on the disposable VM
        run: |
          version=$(cat VERSION)
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "$PWD/desktop/build/packages/atom-${version}-linux-x64-internal-unsigned/atom-${version}-linux-x64-internal-unsigned.deb"
      - name: Exercise actual production Open, Save and Cancel in X11
        if: matrix.session == 'x11'
        run: xvfb-run -a -s '-screen 0 1440x900x24 -nolisten tcp' dbus-run-session -- sh desktop/test/deb-session.sh x11 dialogs
      - name: Exercise actual production Open, Save and Cancel in native Wayland
        if: matrix.session == 'wayland'
        run: dbus-run-session -- sh desktop/test/deb-session.sh wayland dialogs
      - name: Remove only the qualification package
        if: always()
        run: sudo env DEBIAN_FRONTEND=noninteractive apt-get purge -y atom-planner
      # Native chooser receipts/trees and failure diagnostics only. Do not
      # publish generated projects/reports, app archives or bundled data.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: production-native-dialogs-${{ matrix.session }}
          path: |
            desktop/test-results/native-surfaces.json
            desktop/test-results/native-surfaces-failed.png
            desktop/test-results/native-print-*.png
            desktop/test-results/native-pipewire.log
            desktop/test-results/native-wireplumber.log
            desktop/test-results/native-dialog-portal.log
            desktop/test-results/native-dialog-portal-version.txt
            desktop/test-results/deb-compositor.log
          if-no-files-found: warn
          retention-days: 30
