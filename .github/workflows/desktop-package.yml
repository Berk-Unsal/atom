name: Desktop package assembly

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'backend-go/**'
      - 'frontend-react/**'
      - 'icon/**'
      - 'VERSION'
      - 'scripts/desktop-package.sh'
      - '.github/workflows/desktop-package.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Internal package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - run: npm ci --prefix frontend-react
      - run: npm ci --prefix desktop
      - run: npm run build --prefix desktop
      - run: npm run package --prefix desktop -- --dmg
      - run: npm run test:package --prefix desktop
      - name: Prepare only disposable macOS Print qualification tools and display
        run: |
          brew install poppler tesseract
          mkdir -p desktop/test-results/macos-ocr
          curl --fail --silent --show-error --location 'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/923915d4ced2a7235221788285785a29c4a42d4a/tur.traineddata' --output desktop/test-results/macos-ocr/tur.traineddata
          printf '%s  %s\n' '7393381111e1152420fc4092cb44eef4237580d21b92bf30d7d221aad192c6b7' 'desktop/test-results/macos-ocr/tur.traineddata' | shasum -a 256 -c -
          ln -s "$(brew --prefix tesseract)/share/tessdata/eng.traineddata" desktop/test-results/macos-ocr/eng.traineddata
          mkdir -p desktop/test-results
          swift desktop/test/macos-display.swift > desktop/test-results/macos-print-display.json
      - name: Exercise actual macOS Print Cancel and a completed local IPP job
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: node desktop/test/macos-print.mjs
      - name: Exercise actual macOS project and report file panels
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: node desktop/test/macos-files.mjs
      # No binary/data upload: the exact default pack's approval is pending.
      # Diagnostics and cryptographic inventories contain no dataset bytes.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: desktop-package-evidence-${{ matrix.os }}
          path: |
            desktop/build/packages/*/package.json
            desktop/build/packages/*/files.json
            desktop/build/packages/*/SHA256SUMS
            desktop/build/packages/*/*.sbom.cdx.json
            desktop/build/packages/*/*.license-index.json
            desktop/test-results/packaged.json
            desktop/test-results/package-failed.png
            desktop/test-results/macos-print.json
            desktop/test-results/macos-print-failed.png
            desktop/test-results/macos-print-output.png
            desktop/test-results/macos-print-display.json
            desktop/test-results/macos-files.json
            desktop/test-results/macos-files-failed.png
          if-no-files-found: warn
          retention-days: 30
