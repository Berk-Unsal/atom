name: Desktop production qualification

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'backend-go/**'
      - 'frontend-react/**'
      - '.github/workflows/desktop-production-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-production-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-budgets:
    name: Production budgets (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - run: npm ci --prefix frontend-react
      - run: npm ci --prefix desktop
      - run: npm run build --prefix desktop
      - name: Prepare an advertised macOS display mode for the required viewport
        if: runner.os == 'macOS'
        run: |
          mkdir -p desktop/test-results
          swift desktop/test/macos-display.swift > desktop/test-results/macos-display.json
      - name: Prepare sandboxed Ubuntu graphical session
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb dbus-x11 lsof apparmor-utils libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libxss1 libxshmfence1 libxkbcommon0 libatk-bridge2.0-0t64 libcups2t64
          node desktop/node_modules/electron/install.js
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile atom-qualification "%s" flags=(unconfined) {\n  userns,\n}\n' "$PWD/desktop/node_modules/electron/dist/electron" | sudo tee /etc/apparmor.d/atom-qualification >/dev/null
          sudo apparmor_parser -r /etc/apparmor.d/atom-qualification
      - name: Measure macOS startup and whole-tree idle memory
        if: runner.os == 'macOS'
        run: npm run test:startup-budget --prefix desktop
      - name: Measure Ubuntu X11 startup and whole-tree idle memory
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1600x1200x24 -nolisten tcp' dbus-run-session -- npm run test:startup-budget --prefix desktop
      - name: Compare macOS standalone/native RF and eight-Cell map
        if: runner.os == 'macOS' && !cancelled()
        run: npm run test:rf-parity --prefix desktop
      - name: Compare Ubuntu X11 standalone/native RF and eight-Cell map
        if: runner.os == 'Linux' && !cancelled()
        run: xvfb-run -a -s '-screen 0 1600x1200x24 -nolisten tcp' dbus-run-session -- npm run test:rf-parity --prefix desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: desktop-production-qualification-${{ matrix.os }}
          path: |
            desktop/test-results/startup-budget.json
            desktop/test-results/macos-display.json
            desktop/test-results/startup-failed.png
            desktop/test-results/rf-parity.json
            desktop/test-results/qualification-eight-cell-map.png
            desktop/test-results/qualification-failed.png
          if-no-files-found: warn
          retention-days: 30
