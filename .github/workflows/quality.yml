name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          show-patched-versions: true

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend-go/go.mod
          cache: false
      - run: python3 scripts/versioning.py check
      - run: python3 scripts/check_runtime_versions.py
      - run: python3 scripts/check_supply_chain.py
      - run: python3 scripts/check_workflow_action_pins.py
      - run: python3 -m unittest scripts/check_supply_chain_test.py scripts/check_workflow_action_pins_test.py
      - run: python3 scripts/generate_policy.py --check
      - run: python3 -m unittest scripts/generate_policy_test.py

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - run: go vet ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - run: govulncheck ./...
      - run: go test -race ./...
      - run: go run ./cmd/validate-dataset ../data-pipeline

  core-lab-adapter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core-lab-adapter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core-lab-adapter/go.mod
          cache-dependency-path: core-lab-adapter/go.sum
      - run: go vet ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - run: govulncheck ./...
      - run: go test -race ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - run: npm ci
      - run: npm run audit:security
      - run: npm run lint
      - run: npm test
      - run: npm run build

  desktop-host:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm test

  desktop-native-smoke:
    name: Desktop smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - run: npm ci --prefix frontend-react
      - run: npm ci --prefix desktop
      - run: npm run build --prefix desktop
      - run: npm run test:runtime --prefix desktop
      - name: Prepare sandboxed Ubuntu graphical smoke
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb dbus-x11 lsof apparmor-utils libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libxss1 libxshmfence1 libxkbcommon0 libatk-bridge2.0-0t64 libcups2t64
          node desktop/node_modules/electron/install.js
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile atom-host-smoke "%s" flags=(unconfined) {\n  userns,\n}\n' "$PWD/desktop/node_modules/electron/dist/electron" | sudo tee /etc/apparmor.d/atom-host-smoke >/dev/null
          sudo apparmor_parser -r /etc/apparmor.d/atom-host-smoke
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile atom-storage-smoke "%s" flags=(unconfined) {\n  userns,\n}\n' "$PWD/desktop/build/storage-package/atom/atom-storage-test" | sudo tee /etc/apparmor.d/atom-storage-smoke >/dev/null
          sudo apparmor_parser -r /etc/apparmor.d/atom-storage-smoke
      - name: Native macOS smoke
        if: runner.os == 'macOS'
        run: npm run test:native --prefix desktop
      - name: Native Ubuntu X11 smoke
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- npm run test:native --prefix desktop
      - name: Native macOS development loop
        if: runner.os == 'macOS'
        run: npm run test:dev-loop --prefix desktop
      - name: Native Ubuntu X11 development loop
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- npm run test:dev-loop --prefix desktop
      - name: Native macOS durable storage
        if: runner.os == 'macOS' && !cancelled()
        run: npm run test:storage --prefix desktop
      - name: Native Ubuntu X11 durable storage
        if: runner.os == 'Linux' && !cancelled()
        run: xvfb-run -a dbus-run-session -- npm run test:storage --prefix desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: desktop-host-smoke-${{ matrix.os }}
          path: desktop/test-results
          if-no-files-found: warn

  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  data-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data-pipeline/Requirements.txt
      - run: "python -m pip install --require-hashes --only-binary=:all: -r data-pipeline/Requirements.txt"
      - run: python -c "import geopandas, numpy, osmnx, pandas, shapely"
      - run: python -m compileall -q -x '/\.venv/' data-pipeline

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: "python -m pip install --require-hashes --only-binary=:all: -r docs/requirements.txt"
      - uses: pandoc/actions/setup@86321b6dd4675f5014c611e05088e10d4939e09e # v1.1.1
        with:
          version: "3.10"
      - run: sh docs/build-reference-pages.sh
      - run: git diff --exit-code -- docs/*.html docs/search-index.json docs/assets/app-theme.css
      - run: node --check docs/assets/docs.js
      - run: node --check docs/assets/docs-theme.js
      - run: python -m unittest discover -s docs -p '*_test.py'
      - run: python docs/validate_claims.py
      - run: python docs/validate_docs.py

  container-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build production image for inspection
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: atom:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check production zlib security floor
        run: sh scripts/check_container_zlib.sh atom:ci
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: atom:ci
          format: spdx-json
          output-file: atom.spdx.json
          artifact-name: atom-sbom
          syft-version: v1.44.0
          upload-artifact: true
      - name: Scan production image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: atom:ci
          version: v0.70.0
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Build Core Lab adapter image for inspection
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: core-lab-adapter
          load: true
          tags: atom-core-lab-adapter:ci
          cache-from: type=gha,scope=core-lab-adapter
          cache-to: type=gha,mode=max,scope=core-lab-adapter
      - name: Check Core Lab adapter zlib security floor
        run: sh scripts/check_container_zlib.sh atom-core-lab-adapter:ci
      - name: Generate Core Lab adapter SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: atom-core-lab-adapter:ci
          format: spdx-json
          output-file: atom-core-lab-adapter.spdx.json
          artifact-name: atom-core-lab-adapter-sbom
          syft-version: v1.44.0
          upload-artifact: true
      - name: Scan Core Lab adapter image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: atom-core-lab-adapter:ci
          version: v0.70.0
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
