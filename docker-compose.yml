services:
  atom:
    build:
      context: .
      dockerfile: Dockerfile
    image: atom:local
    container_name: atom-app
    restart: unless-stopped
    ports:
      - "${ATOM_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    environment:
      GIN_MODE: release
      BIND_ADDRESS: "0.0.0.0"
      PORT: "8080"
      MAX_CONCURRENT_RF_REQUESTS: "2"
      MAX_CONCURRENT_RF_REQUESTS_PER_CLIENT: "1"
      RF_REQUESTS_PER_MINUTE: "20"
      RF_REQUEST_TIMEOUT_SECONDS: "60"
      RF_API_KEY: "${RF_API_KEY:-}"
      MAX_CONCURRENT_BUILDING_DOWNLOADS: "2"
      MAX_CONCURRENT_BUILDING_DOWNLOADS_PER_CLIENT: "1"
      BUILDING_DOWNLOADS_PER_MINUTE: "2"
      BUILDINGS_API_KEY: "${BUILDINGS_API_KEY:-}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
      ATOM_DATASET_DIR: /app/data-pipeline
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
