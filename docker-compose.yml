services:
  atom:
    build:
      context: .
      dockerfile: Dockerfile
    image: atom:local
    container_name: atom-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      GIN_MODE: release
      PORT: "8080"
      MAX_CONCURRENT_RF_REQUESTS: "2"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
