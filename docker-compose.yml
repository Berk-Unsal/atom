services:
  atom:
    build:
      context: .
      dockerfile: Dockerfile
    image: atom:local
    container_name: atom-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      GIN_MODE: release
      PORT: "8080"

  mongodb:
    image: mongo:7.0
    container_name: ankara-raytracer-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ankara_raytracer
    volumes:
      - mongodb_data:/data/db
      - ./local-infrastructure/mongodb-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
