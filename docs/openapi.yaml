      properties:
        network_score: { type: number, description: Deprecated legacy raw aggregate retained for compatibility; do not use for recommendation ranking. }
        score: { type: number, minimum: 0, maximum: 100, description: Composite optimization score shown to users. }
        composite_score: { type: number, minimum: 0, maximum: 1 }
        unique_demand_buildings: { type: integer, minimum: 0 }
        unique_residential_buildings: { type: integer, minimum: 0 }
        overlap_buildings: { type: integer, minimum: 0 }
        demand_score: { type: number, minimum: 0 }
        residential_score: { type: number, minimum: 0 }
        coverage_score: { type: number, minimum: 0 }
        overlap_penalty: { type: number, minimum: 0 }
        data_quality: { type: string }
        raw_metrics: { $ref: "#/components/schemas/NetworkOptimizationRawMetrics" }
        objectives: { $ref: "#/components/schemas/NetworkOptimizationUtilities" }
        objective_breakdown: { $ref: "#/components/schemas/NetworkOptimizationBreakdown" }
        objective_status: { type: object, additionalProperties: { $ref: "#/components/schemas/OptimizationObjectiveStatus" } }
    NetworkOptimizationCellConfiguration:
      type: object
      required: [id, tower_lon, tower_lat, azimuth_deg, rf_profile]
      properties:
        id: { type: string }
        tower_lon: { type: number, minimum: -180, maximum: 180 }
        tower_lat: { type: number, minimum: -90, maximum: 90 }
        azimuth_deg: { type: number, minimum: 0, maximum: 360 }
        rf_profile: { $ref: "#/components/schemas/RFProfile" }
    NetworkOptimizationParameters:
      type: object
      required: [rays, radius_m, frequency_ghz, tx_power_dbm, beam_width]
      properties:
        rays: { type: integer, minimum: 0 }
        radius_m: { type: number, minimum: 0 }
        frequency_ghz: { type: number, minimum: 0 }
        tx_power_dbm: { type: number, minimum: 0 }
        beam_width: { type: number, minimum: 0 }
        calibration_offset_db: { type: number }
    NetworkOptimizationSolution:
      type: object
      required: [cell_configurations, parameters, stats, constraints_satisfied]
      properties:
        cell_configurations: { type: array, items: { $ref: "#/components/schemas/NetworkOptimizationCellConfiguration" } }
        parameters: { $ref: "#/components/schemas/NetworkOptimizationParameters" }
        stats: { $ref: "#/components/schemas/NetworkOptimizationStats" }
        constraints_satisfied: { type: boolean }
        violations: { type: array, items: { type: string } }
    OptimizationOutcome:
      type: object
      properties:
        objectives: { type: array, items: { type: object, additionalProperties: true } }
        configured_priorities: { type: object, additionalProperties: { type: number, minimum: 0, maximum: 100 } }
        normalized_weights: { type: object, additionalProperties: { type: number, minimum: 0, maximum: 1 } }
        effective_weights: { type: object, additionalProperties: { type: number, minimum: 0, maximum: 1 } }
        objective_status: { type: object, additionalProperties: { $ref: "#/components/schemas/OptimizationObjectiveStatus" } }
        constraints: { $ref: "#/components/schemas/OptimizationConstraints" }
        objective_score: { type: number, description: Deprecated legacy aggregate retained for compatibility. }
        composite_score: { type: number, minimum: 0, maximum: 1 }
        score: { type: number, minimum: 0, maximum: 100 }
        recommended_solution_id: { type: string, description: Stable ID of the current top-ranked Pareto solution. }
        constraints_satisfied: { type: boolean }
        recommended: { type: boolean }
        violations: { type: array, items: { type: string } }
        adjusted_parameters: { type: array, items: { type: string } }
    NetworkOptimizedTower:
      type: object
      properties:
        id: { type: string }
        optimal_azimuth: { type: number }
        score: { type: number, description: Legacy per-cell raw score retained for compatibility. }
        rf_profile: { $ref: "#/components/schemas/RFProfile" }
    NetworkParetoSolution:
      type: object
      properties:
        id: { type: string, description: Stable deterministic ID derived from the cell azimuth set. }
        towers: { type: array, items: { type: object, required: [id, azimuth_deg], properties: { id: { type: string }, azimuth_deg: { type: number } } } }
        stats: { $ref: "#/components/schemas/NetworkOptimizationStats" }
        objective_score: { type: number, description: Deprecated legacy aggregate retained for compatibility. }
        composite_score: { type: number, minimum: 0, maximum: 1 }
        score: { type: number, minimum: 0, maximum: 100 }
        explanation: { type: string }
    NetworkOptimizationResponse:
      type: object
      required: [optimized_towers, stats, optimization_domain, optimization, pareto_frontier, request_defaults, effective_cell_profiles, rf_contract]
      properties:
        optimized_towers: { type: array, items: { $ref: "#/components/schemas/NetworkOptimizedTower" } }
        stats: { $ref: "#/components/schemas/NetworkOptimizationStats" }
        request_defaults: { $ref: "#/components/schemas/RFRequestDefaults" }
        effective_cell_profiles: { type: array, items: { $ref: "#/components/schemas/EffectiveCellRFProfile" } }
        rf_contract: { $ref: "#/components/schemas/RFContractMetadata" }
        optimization_run_id: { type: string, description: Stable identity for RF-affecting optimization state; objective priorities are excluded so raw explanations can survive priority-only re-ranking. }
        optimization_domain: { $ref: "#/components/schemas/OptimizationDomainMetadata" }
        optimization: { $ref: "#/components/schemas/OptimizationOutcome" }
        pareto_frontier: { type: array, items: { $ref: "#/components/schemas/NetworkParetoSolution" } }
        baseline: { $ref: "#/components/schemas/NetworkOptimizationSolution", description: Exact selected-cell configuration and prepared-domain metrics entering optimize-network. }
    NetworkCellExplanationRequest:
      type: object
      required: [solution_id, cell_id, baseline, solution]
      properties:
        run_id: { type: string, description: Optimization run identity returned by optimize-network. }
        solution_id: { type: string, description: Stable ID of the currently inspected Pareto solution. }
        cell_id: { type: string, description: ID of the one changed cell to restore to baseline. }
        baseline: { $ref: "#/components/schemas/NetworkOptimizationSolution", description: Authoritative baseline snapshot from the same optimize-network response. }
        solution: { $ref: "#/components/schemas/NetworkParetoSolution", description: Currently inspected selected Pareto solution; it is not silently replaced by the recommended solution. }
        optimization: { $ref: "#/components/schemas/OptimizationConfig", description: Current objective priorities and hard constraints used to interpret the explanation. }
        optimization_domain: { $ref: "#/components/schemas/OptimizationDomainMetadata", description: Retained domain metadata. When supplied, it must match the reconstructed baseline context. }
    NetworkCellExplanationCell:
      type: object
      required: [id, baseline_azimuth_deg, selected_azimuth_deg]
      properties:
        id: { type: string }
        baseline_azimuth_deg: { type: number, minimum: 0, maximum: 360 }
        selected_azimuth_deg: { type: number, minimum: 0, maximum: 360 }
    NetworkCellExplanationSide:
      type: object
      required: [raw_metrics, constraints_satisfied]
      properties:
        raw_metrics: { $ref: "#/components/schemas/NetworkOptimizationRawMetrics" }
        constraints_satisfied: { type: boolean }
        violations: { type: array, items: { type: string } }
    NetworkCellExplanationDelta:
      type: object
      required: [served_demand_weight, residential_covered, propagation_reach_score, propagation_reach_ratio, overlap_buildings, overlap_ratio, covered_units]
      properties:
        served_demand_weight: { type: number, description: Selected raw metric minus the baseline-reverted raw metric. }
        residential_covered: { type: integer, description: Selected raw metric minus the baseline-reverted raw metric. }
        propagation_reach_score: { type: number, description: Selected raw metric minus the baseline-reverted raw metric. }
        propagation_reach_ratio: { type: number, description: Selected utility minus the baseline-reverted utility; present as percentage points in the UI. }
        overlap_buildings: { type: integer, description: Selected raw metric minus the baseline-reverted raw metric; lower is preferred. }
        overlap_ratio: { type: number, description: Selected raw metric minus the baseline-reverted raw metric; lower is preferred and positive values are worse. }
        covered_units: { type: integer, description: Selected raw metric minus the baseline-reverted raw metric; informational only. }
    NetworkCellExplanationScore:
      type: object
      required: [actual, counterfactual, delta, effective_weights]
      properties:
        actual: { type: number, minimum: 0, maximum: 100, description: Composite score under the supplied priorities. }
        counterfactual: { type: number, minimum: 0, maximum: 100, description: Composite score under the supplied priorities; feasibility is reported separately. }
        delta: { type: number, description: Actual minus counterfactual composite score. }
        effective_weights: { type: object, additionalProperties: { type: number, minimum: 0, maximum: 1 } }
    NetworkCellExplanationResponse:
      type: object
      required: [available, unchanged, run_id, solution_id, cell, actual, counterfactual, delta, score, objective_status, optimization_domain, limitations]
      properties:
        available: { type: boolean }
        unchanged: { type: boolean, description: True when the selected cell already matches its baseline azimuth; no RF counterfactual is evaluated. }
        run_id: { type: string }
        solution_id: { type: string }
        cell: { $ref: "#/components/schemas/NetworkCellExplanationCell" }
        actual: { $ref: "#/components/schemas/NetworkCellExplanationSide", description: Stored raw metrics for the inspected selected solution. }
        counterfactual: { $ref: "#/components/schemas/NetworkCellExplanationSide", description: One evaluation with only the requested cell restored to baseline; it remains inspectable when infeasible. }
        delta: { $ref: "#/components/schemas/NetworkCellExplanationDelta" }
        score: { $ref: "#/components/schemas/NetworkCellExplanationScore" }
        objective_status: { type: object, additionalProperties: { $ref: "#/components/schemas/OptimizationObjectiveStatus" } }
        optimization_domain: { $ref: "#/components/schemas/OptimizationDomainMetadata" }
        limitations: { type: array, items: { type: string }, description: Explicit conditional-comparison limitations; this is not causal attribution or an additive decomposition. }
    InterferenceRequest:
      allOf:
        - { $ref: "#/components/schemas/NetworkRequest" }
        - type: object
          required: [network_tech, towers]
          properties:
            network_tech: { type: string, enum: [4g, 5g] }
            bandwidth_mhz: { type: number }
            load_factor: { type: number, exclusiveMinimum: 0, maximum: 1, default: 0.7 }
            reuse_factor: { type: integer, enum: [1, 3], default: 1 }
            noise_figure_db: { type: number, minimum: 0, maximum: 20, default: 7 }
            sample_spacing_m: { type: number, minimum: 20, maximum: 200, default: 40 }
    RecommendationRequest:
      allOf:
        - { $ref: "#/components/schemas/NetworkRequest" }
        - type: object
          required: [network_tech, search_polygon]
          properties:
            network_tech: { type: string, enum: [4g, 5g] }
            towers: { type: array, minItems: 2, maxItems: 5, items: { $ref: "#/components/schemas/Tower" } }
            search_polygon:
              type: array
              minItems: 3
              maxItems: 256
              items: { type: array, minItems: 2, maxItems: 2, items: { type: number } }
            max_results: { type: integer, minimum: 1, maximum: 10, default: 5 }
    Recommendation:
      type: object
      required: [id, cell_id, tower_lon, tower_lat, optimal_azimuth, marginal_network_score, stats, reason]
      properties:
        id: { type: string }
        cell_id: { type: integer, format: int64 }
        tower_lon: { type: number, minimum: -180, maximum: 180 }
        tower_lat: { type: number, minimum: -90, maximum: 90 }
        optimal_azimuth: { type: number }
        marginal_network_score: { type: number, description: Raw legacy compatibility delta; not a normalized /100 score. }
        stats: { type: object, additionalProperties: true }
        reason: { type: string }
        rf_profile: { $ref: "#/components/schemas/RFProfile" }
    RecommendationFeature:
      type: object
      required: [type, id, properties, geometry]
      properties:
        type: { type: string, const: Feature }
        id: { type: string, description: References the canonical recommendations item with the same id. }
        properties: { type: object, maxProperties: 0 }
        geometry:
          type: object
          required: [type, coordinates]
          properties:
            type: { type: string, const: Point }
            coordinates: { type: array, minItems: 2, maxItems: 2, items: { type: number } }
    RecommendationResponse:
      type: object
      required: [baseline, candidates_evaluated, recommendations, geojson, notes, request_defaults, effective_cell_profiles, rf_contract]
      properties:
        baseline: { type: object, additionalProperties: true }
        request_defaults: { $ref: "#/components/schemas/RFRequestDefaults" }
        effective_cell_profiles: { type: array, items: { $ref: "#/components/schemas/EffectiveCellRFProfile" } }
        rf_contract: { $ref: "#/components/schemas/RFContractMetadata" }
        candidates_evaluated: { type: integer, minimum: 0 }
        recommendations: { type: array, items: { $ref: "#/components/schemas/Recommendation" } }
        geojson:
          type: object
          required: [type, features]
          properties:
            type: { type: string, const: FeatureCollection }
            features: { type: array, items: { $ref: "#/components/schemas/RecommendationFeature" } }
        notes: { type: array, items: { type: string } }
    MeasurementRequest:
      allOf:
        - { $ref: "#/components/schemas/InterferenceRequest" }
        - type: object
          required: [samples]
          properties:
            towers: { type: array, minItems: 1, maxItems: 6, items: { $ref: "#/components/schemas/Tower" } }
            calibration_provenance:
              type: object
              properties:
                campaign_id: { type: string }
                source: { type: string }
                collected_at: { type: string, format: date-time }
                expires_at: { type: string, format: date-time }
            samples:
              type: array
              minItems: 1
              maxItems: 5000
              items:
                type: object
                required: [id, lon, lat, technology, rsrp_dbm]
                properties:
                  id: { type: string }
                  lon: { type: number, minimum: -180, maximum: 180 }
                  lat: { type: number, minimum: -90, maximum: 90 }
                  technology: { type: string, enum: [4g, 5g] }
                  rsrp_dbm: { type: number, minimum: -180, maximum: -20 }
                  cell_id: { type: string }
    PathProfileRequest:
      type: object
      required: [transmitter, receiver]
      properties:
        transmitter: { $ref: "#/components/schemas/LonLat" }
        receiver: { $ref: "#/components/schemas/LonLat" }
        sample_spacing_m: { type: number, minimum: 1, maximum: 250, default: 10 }
        model_profile: { type: string, enum: [terrain-profile, urban-short-range, research-sub-thz] }
        azimuth: { type: number }
        calibration_offset_db: { type: number, minimum: -40, maximum: 40 }
        rf_profile: { $ref: "#/components/schemas/RFProfile" }
        fidelity:
          type: object
          properties:
            building_loss_mode: { type: string, enum: [screen-diffraction, penetration, none] }
            diffraction_model: { type: string, enum: [single-knife-edge, none] }
            default_wall_material: { type: string, enum: [concrete, brick, glass, wood, metal, unknown] }
            clutter_specific_attenuation_db_per_km: { type: number, minimum: 0 }
            vegetation_depth_m: { type: number, minimum: 0 }
            vegetation_specific_attenuation_db_per_m: { type: number, minimum: 0 }
            gas_specific_attenuation_db_per_km: { type: number, minimum: 0 }
            rain_specific_attenuation_db_per_km: { type: number, minimum: 0 }
            shadow_sigma_db: { type: number, minimum: 0 }
    LonLat:
      type: object
      required: [lon, lat]
      properties:
        lon: { type: number, minimum: -180, maximum: 180 }
        lat: { type: number, minimum: -90, maximum: 90 }
    CoverageSurfaceRequest:
      allOf:
        - { $ref: "#/components/schemas/SectorRequest" }
        - type: object
          properties:
            cell_size_m: { type: number, minimum: 10, maximum: 250, default: 25 }
            thresholds_dbm: { type: array, minItems: 1, maxItems: 10, uniqueItems: true, items: { type: number, minimum: -180, maximum: 0 } }
    CoverageSurfaceResponse:
      type: object
      required: [grid, contours, stats, model, rf_contract]
      properties:
        grid:
          type: object
          required: [crs, bounds, width, height, cell_size_m, nodata, row_order, values]
          properties:
            crs: { type: string, const: "OGC:CRS84" }
            bounds: { type: array, minItems: 4, maxItems: 4, items: { type: number } }
            width: { type: integer, minimum: 2 }
            height: { type: integer, minimum: 2 }
            cell_size_m: { type: number }
            nodata: { type: number, const: -9999 }
            row_order: { type: string, const: south-to-north }
            values: { type: array, maxItems: 100000, items: { type: number } }
        contours: { $ref: "#/components/schemas/FeatureCollection" }
        stats:
          type: object
          required: [cell_count, valid_cell_count, nodata_cell_count, below_sensitivity_cell_count, receiver_sensitivity_dbm]
          properties:
            cell_count: { type: integer, minimum: 0 }
            valid_cell_count: { type: integer, minimum: 0 }
            nodata_cell_count: { type: integer, minimum: 0 }
            below_sensitivity_cell_count: { type: integer, minimum: 0 }
            min_dbm: { type: [number, "null"] }
            max_dbm: { type: [number, "null"] }
            receiver_sensitivity_dbm: { type: number, description: Effective selected-cell receiver threshold; not a surface mask. }
        model:
          type: object
          required: [type, value_semantics, nodata_meaning, uses_sensitivity_mask]
          properties:
            type: { type: string }
            value_semantics: { type: string, const: raw_received_power_dbm }
            nodata_meaning: { type: string }
            uses_sensitivity_mask: { type: boolean, const: false }
            los_classifier_id: { type: string, description: "Shared urban classifier ID when urban_short_range is selected." }
            terrain_status: { type: string, enum: [terrain_available, terrain_unavailable] }
            assumptions: { type: array, items: { type: string } }
        rf_contract: { $ref: "#/components/schemas/RFContractMetadata" }
    OptimizeAzimuthResponse:
      type: object
      required: [optimal_azimuth, propagation_reach_score, coverage_score, demand_score, residential_score, rf_contract]
      properties:
        optimal_azimuth: { type: number }
        propagation_reach_score: { type: number, description: Aggregate usable-ray reach score; coverage_score remains a compatibility alias. }
        coverage_score: { type: number, description: Compatibility alias for propagation_reach_score. }
        demand_score: { type: number }
        residential_score: { type: number }
        rf_contract: { $ref: "#/components/schemas/RFContractMetadata" }
    PathProfileResponse:
      type: object
      required: [rf_contract]
      properties:
        rf_contract: { $ref: "#/components/schemas/RFContractMetadata" }
        terrain: { $ref: "#/components/schemas/TerrainMetadata" }
      additionalProperties: true
    InterferenceModel:
      type: object
      required: [request_defaults, effective_cell_profiles, rf_contract, rsrp_threshold_dbm, sinr_threshold_db, rsrq_threshold_db, serviceability_rule]
      properties:
        request_defaults: { $ref: "#/components/schemas/RFRequestDefaults" }
        effective_cell_profiles: { type: array, items: { $ref: "#/components/schemas/EffectiveCellRFProfile" } }
        rf_contract: { $ref: "#/components/schemas/RFContractMetadata" }
        profiles: { type: array, items: { $ref: "#/components/schemas/RFProfile" } }
        rsrp_threshold_dbm: { type: number, const: -110 }
        sinr_threshold_db: { type: number, const: 0 }
        rsrq_threshold_db: { type: number, const: -20 }
        serviceability_rule: { type: string }
    InterferenceResponse:
      type: object
      required: [geojson, demand_geojson, stats, model]
      properties:
        geojson: { $ref: "#/components/schemas/FeatureCollection", description: "Sample properties include los_state, los_classifier_id, los_classification_basis, terrain_status, and los_classification evidence for serving cells." }
        demand_geojson: { $ref: "#/components/schemas/FeatureCollection" }
        stats: { type: object, additionalProperties: true }
        model: { $ref: "#/components/schemas/InterferenceModel" }
    MeasurementResponse:
      type: object
      required: [rf_contract, request_defaults, effective_cell_profiles]
      properties:
        rf_contract: { $ref: "#/components/schemas/RFContractMetadata" }
        request_defaults: { $ref: "#/components/schemas/RFRequestDefaults" }
        effective_cell_profiles: { type: array, items: { $ref: "#/components/schemas/EffectiveCellRFProfile" } }
      additionalProperties: true
    ExperimentDefinition:
      type: object
      required: [base]
      properties:
        name: { type: string, maxLength: 128 }
        base: { $ref: "#/components/schemas/SectorRequest" }
        matrix:
          type: object
          properties:
            frequencies_ghz: { type: array, items: { type: number } }
            tx_powers_dbm: { type: array, items: { type: number } }
            beam_widths_deg: { type: array, items: { type: number } }
            azimuths_deg: { type: array, items: { type: number } }
            calibration_offsets_db: { type: array, items: { type: number } }
    ExperimentJob:
      type: object
      required: [job_id, process_id, status, progress, total_runs, completed_runs, fingerprint]
      properties:
        job_id: { type: string }
        process_id: { type: string, const: batch-experiment }
        status: { type: string, enum: [accepted, running, succeeded, failed, dismissed] }
        progress: { type: number, minimum: 0, maximum: 1 }
        total_runs: { type: integer, minimum: 1, maximum: 64 }
        completed_runs: { type: integer, minimum: 0, maximum: 64 }
        fingerprint: { type: string }
        cache_hit: { type: boolean }
        result: { type: object, additionalProperties: true }
        message: { type: string }
    BuildingFeatureCollection:
      allOf:
        - { $ref: "#/components/schemas/FeatureCollection" }
        - type: object
          required: [numberMatched, numberReturned, limit, offset]
          properties:
            numberMatched: { type: integer, minimum: 0 }
            numberReturned: { type: integer, minimum: 0, maximum: 5000 }
            limit: { type: integer, minimum: 1, maximum: 5000 }
            offset: { type: integer, minimum: 0 }
    FeatureCollection:
      type: object
      required: [type, features]
      properties:
        type: { type: string, const: FeatureCollection }
        features: { type: array, items: { type: object, additionalProperties: true } }
